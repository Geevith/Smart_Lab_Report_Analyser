<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Lab Report Analyser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="clinical_design_system.css">
    <style>
        :root {
            --primary-blue: #0055FF;
            /* Vibrant blue from reference */
            --bg-gray: #F9FAFB;
            --input-bg: #F3F4F6;
            --text-main: #111827;
            --text-sub: #6B7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F2F2F2;
            /* Light gray outer background */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .auth-container {
            display: flex;
            width: 100%;
            height: 100vh;
            background: white;
            overflow: hidden;
        }

        /* --- Left Panel --- */
        .left-panel {
            flex: 1.2;
            background: white;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px;
            overflow: hidden;
        }

        /* Concentric circles background REMOVED */
        .left-bg-circles {
            display: none;
        }

        /* ... Logo styles ... */
        .brand-logo {
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            color: #1F2937;
            align-self: flex-start;
        }

        /* ... */

        /* Central Character Area */
        .character-area {
            z-index: 10;
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .character-float-wrapper {
            animation: characterFloat 3s ease-in-out infinite;
            will-change: transform;
        }

        .character-img {
            width: 520px;
            height: 520px;
            object-fit: contain;
            transition: transform 0.1s ease-out;
            /* For mouse tracking */
            z-index: 2;
        }

        @keyframes characterFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        /* Floating Cards (Decorative) */
        .floating-card {
            position: absolute;
            background: white;
            padding: 10px 16px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            z-index: 1;
            animation: float 6s ease-in-out infinite;
        }

        .icon-box {
            width: 32px;
            height: 32px;
            background: #FFF7ED;
            /* Orange tint */
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .card-1 {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .card-2 {
            top: 15%;
            right: 15%;
            animation-delay: 1s;
        }

        .card-3 {
            bottom: 25%;
            left: 5%;
            animation-delay: 2s;
        }

        .card-4 {
            bottom: 20%;
            right: 10%;
            animation-delay: 3s;
        }

        /* Bottom Text */
        .left-footer {
            z-index: 10;
            text-align: center;
            max-width: 500px;
        }

        .left-headline {
            font-size: 32px;
            font-weight: 800;
            color: #111827;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .pagination-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #E5E7EB;
            border-radius: 4px;
        }

        .dot.active {
            width: 24px;
            background: var(--primary-blue);
        }

        /* --- Right Panel --- */
        .right-panel {
            flex: 1;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
        }

        .auth-form-container {
            width: 100%;
            max-width: 400px;
        }

        .greeting-header {
            margin-bottom: 30px;
        }

        .greeting-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #111827;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .greeting-header p {
            color: #6B7280;
            margin-top: 5px;
            font-size: 15px;
        }

        /* Social Buttons */
        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 30px;
        }

        .social-btn {
            background: #F3F4F6;
            border: none;
            border-radius: 12px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .social-btn:hover {
            background: #E5E7EB;
        }

        .social-btn img {
            width: 24px;
            height: 24px;
        }

        .divider {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .divider span {
            background: white;
            padding: 0 10px;
            color: #9CA3AF;
            font-size: 14px;
            position: relative;
            z-index: 1;
        }

        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #E5E7EB;
            z-index: 0;
        }

        /* Input Fields */
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 20px;
            color: #6B7280;
        }

        .custom-input {
            width: 100%;
            background: #F3F4F6;
            border: none;
            border-radius: 16px;
            padding: 24px 20px 8px 50px;
            /* Pt for label, Pl for icon */
            font-size: 16px;
            font-weight: 500;
            color: #1F2937;
            height: 64px;
            transition: all 0.2s;
        }

        .custom-input:focus {
            outline: none;
            background: white;
            box-shadow: 0 0 0 2px var(--primary-blue);
        }

        .floating-label {
            position: absolute;
            left: 50px;
            top: 12px;
            font-size: 11px;
            color: #6B7280;
            font-weight: 500;
            pointer-events: none;
        }

        .password-eye {
            position: absolute;
            right: 20px;
            color: #9CA3AF;
            cursor: pointer;
        }

        /* CTA Button */
        .btn-cta {
            width: 100%;
            height: 56px;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 85, 255, 0.2);
        }

        .bottom-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #6B7280;
        }

        .bottom-link a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .copyright {
            margin-top: 60px;
            text-align: center;
            font-size: 12px;
            color: #9CA3AF;
        }

        /* Toast Messages */
        .toast-msg {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            text-align: center;
        }

        .toast-error {
            background: #FEE2E2;
            color: #991B1B;
        }

        .toast-success {
            background: #D1FAE5;
            color: #065F46;
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .auth-container {
                flex-direction: column;
                overflow-y: auto;
                height: auto;
            }

            .left-panel {
                height: 400px;
                padding: 20px;
            }

            .left-bg-circles {
                width: 600px;
                height: 600px;
            }

            .floating-card,
            .left-headline,
            .pagination-dots {
                display: none;
            }

            .right-panel {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <!-- LEFT PANEL -->
        <div class="left-panel">
            <div class="left-bg-circles"></div>

            <div class="brand-logo">
                <div class="brand-icon">SL</div>
                Smart Lab
            </div>

            <!-- Floating Cards -->
            <div class="floating-card card-1">
                <div class="icon-box">🎓</div>
                <span>Lab Reports</span>
            </div>
            <div class="floating-card card-2">
                <div class="icon-box">📊</div>
                <span>Interactive Analysis</span>
            </div>
            <div class="floating-card card-3">
                <div class="icon-box">👑</div>
                <span>Expert Insights</span>
            </div>

            <!-- Character -->
            <div class="character-area">
                <div class="character-float-wrapper">
                    <img id="characterImg" src="/assets/images/transparent_doctor_watching.png?t=2" alt="Character"
                        class="character-img">
                </div>
            </div>

            <div class="left-footer">
                <h2 class="left-headline">From Data to Decisions<br>Smart Lab turns reports<br>into clarity.</h2>
                <div class="pagination-dots">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">
            <div class="auth-form-container">
                <div class="greeting-header">
                    <h1>Howdy User 👋</h1>
                    <p>Let's analyze together now.</p>
                </div>

                <div class="social-buttons">
                    <button class="social-btn">
                        <!-- Google SVG -->
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path
                                d="M23.766 12.2764C23.766 11.4607 23.6999 10.6406 23.5588 9.83807H12.24V14.4591H18.7217C18.4528 15.9494 17.5885 17.2678 16.323 18.1056V21.1039H20.19C22.4608 19.0139 23.766 15.9274 23.766 12.2764Z"
                                fill="#4285F4" />
                            <path
                                d="M12.2401 24.0008C15.4766 24.0008 18.2059 22.9382 20.1945 21.1039L16.3275 18.1055C15.2517 18.8375 13.8627 19.252 12.2445 19.252C9.11388 19.252 6.45946 17.1399 5.50705 14.3003H1.5166V17.3912C3.55371 21.4434 7.7029 24.0008 12.2401 24.0008Z"
                                fill="#34A853" />
                            <path
                                d="M5.50253 14.3003C5.00236 12.8099 5.00236 11.1961 5.50253 9.70575V6.61481H1.51649C-0.185514 10.0056 -0.185514 14.0004 1.51649 17.3912L5.50253 14.3003Z"
                                fill="#FBBC05" />
                            <path
                                d="M12.2401 4.74966C13.9509 4.7232 15.6044 5.36697 16.8434 6.54867L20.2695 3.12262C18.1001 1.0855 15.2208 -0.034466 12.2401 0.000808666C7.7029 0.000808666 3.55371 2.55822 1.5166 6.61481L5.50264 9.70575C6.45064 6.86173 9.10947 4.74966 12.2401 4.74966Z"
                                fill="#EA4335" />
                        </svg>
                    </button>
                    <button class="social-btn">
                        <!-- Apple SVG -->
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="black">
                            <path
                                d="M17.05 20.28c-.98.95-2.05.88-3.08.4-.35-.16-1.07-.47-2.14-.47-1.12 0-1.87.35-2.26.51-1 .47-2.13.56-3.07-.35-.38-.38-2.61-2.92-2.17-7.38.19-2.08 1.12-3.8 2.31-4.75.92-.76 2.05-.9 2.76-.9.69 0 1.25.13 1.94.4.92.35 1.59.35 2.53 0 1.09-.38 2.22-.52 3.11-.27 1.25.33 2.15 1.05 2.65 1.76-2.3 1.27-1.92 4.67.29 5.86-.44 1.4-1.16 2.92-2.15 4.09l-.72 1.1zM12.03 7.25c-.15 2.23-1.93 4.04-3.9 4.04-.26 0-.54-.03-.81-.07.28-2.35 2.18-4.14 4.02-4.15.21 0 .47.04.69.18z" />
                        </svg>
                    </button>
                </div>

                <div class="divider"><span>Or</span></div>

                <div id="errorMessage" class="toast-msg toast-error"></div>
                <div id="successMessage" class="toast-msg toast-success"></div>

                <form id="loginForm">
                    <!-- Email Field -->
                    <div class="input-group">
                        <div class="input-wrapper">
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                                </path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            <span class="floating-label">Email Address</span>
                            <input type="text" id="usernameOrEmail" class="custom-input" placeholder="user@example.com"
                                required>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="input-group">
                        <div class="input-wrapper">
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <span class="floating-label">Password</span>
                            <input type="password" id="password" class="custom-input" placeholder="••••••••" required>

                            <div class="password-eye" id="togglePassword">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Remember Me Checkbox -->
                    <div class="input-group" style="margin-bottom: 10px;">
                        <label
                            style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: #6B7280;">
                            <input type="checkbox" id="rememberMe" checked
                                style="width: 18px; height: 18px; cursor: pointer;">
                            <span>Remember me for 30 days</span>
                        </label>
                    </div>

                    <button type="submit" class="btn-cta" id="loginButton">Start Analyzing</button>
                </form>

                <div class="bottom-link">
                    New to Smart Lab? <a href="register.html">Sign Up</a>
                </div>

                <div class="copyright">
                    © 2026 All Rights Reserved
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>
    <script>
        // --- Interactive Character Logic ---
        const characterImg = document.getElementById('characterImg');
        const usernameInput = document.getElementById('usernameOrEmail');
        const passwordInput = document.getElementById('password');
        const greetingHeader = document.querySelector('.greeting-header h1');

        const ASSET_WATCHING = '/assets/images/transparent_doctor_watching.png?t=2';
        const ASSET_HIDING = '/assets/images/transparent_doctor_hiding.png?t=2';

        let isHiding = false;

        document.addEventListener('mousemove', (e) => {
            if (isHiding) return;
            const xLimit = 20;
            const yLimit = 10;
            const x = (e.clientX / window.innerWidth - 0.5) * xLimit * 2 * -1; // Inverted
            const y = (e.clientY / window.innerHeight - 0.5) * yLimit * 2 * -1; // Inverted
            characterImg.style.transform = `translate(${x}px, ${y}px)`;
        });

        // Focus States
        usernameInput.addEventListener('focus', () => {
            isHiding = false;
            characterImg.src = ASSET_WATCHING;
            characterImg.style.transform = `scale(1.05)`;
            greetingHeader.innerText = "Howdy User 👋";
        });

        passwordInput.addEventListener('focus', () => {
            isHiding = true;
            characterImg.src = ASSET_HIDING;
            characterImg.style.transform = `translateY(10px)`;
            greetingHeader.innerText = "It's a secret 🤫";
        });

        passwordInput.addEventListener('blur', () => {
            isHiding = false;
            characterImg.src = ASSET_WATCHING;
            characterImg.style.transform = `translate(0, 0)`;
            greetingHeader.innerText = "Howdy User 👋";
        });

        // Toggle Password
        const togglePassword = document.getElementById('togglePassword');
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            // Optionally change icon color or opacity
            togglePassword.style.color = type === 'password' ? '#9CA3AF' : 'var(--primary-blue)';
        });

        // Login Logic
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        checkAuth().then(user => { if (user) window.location.href = 'upload_ui.html'; }).catch(() => { });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            const formData = {
                username_or_email: usernameInput.value.trim(),
                password: passwordInput.value,
                remember_me: document.getElementById('rememberMe').checked
            };

            loginButton.disabled = true;
            loginButton.innerText = 'Verifying...';

            try {
                const result = await handleLogin(formData);

                if (result.success) {
                    successMessage.textContent = 'Login successful!';
                    successMessage.style.display = 'block';
                    characterImg.style.transform = `translateY(-20px) scale(1.1)`; // Bounce
                    setTimeout(() => { window.location.href = 'upload_ui.html'; }, 800);
                } else {
                    throw new Error(result.error || 'Login failed');
                }
            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.style.display = 'block';
                loginButton.disabled = false;
                loginButton.innerText = 'Start Analyzing';

                // Shake
                const container = document.querySelector('.auth-form-container');
                container.style.animation = 'shake 0.4s ease-in-out';
                setTimeout(() => container.style.animation = '', 400);
            }
        });

        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(styleSheet);
    </script>
</body>

</html>
