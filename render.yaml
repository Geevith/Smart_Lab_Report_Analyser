services:
  - type: web
    name: smart-lab-report-analyser
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn backend.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
